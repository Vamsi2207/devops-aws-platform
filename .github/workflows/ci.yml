name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devops-platform:${{ github.sha }} .

      - name: Run container
        run: docker run -d --rm --name devops-platform -p 8080:8080 devops-platform:${{ github.sha }}

      - name: Check health endpoint
        run: |
          for i in {1..10}; do
            if curl --fail --silent --show-error http://localhost:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs devops-platform
          exit 1